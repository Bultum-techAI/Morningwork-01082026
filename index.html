<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Work – Third Grade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf4ff;--card:#ffffff;--ink:#1d2b53;--mute:#5a6685;--line:#cfe0f5;
  --bus:#ffc933;--bus-ink:#1d2b53;--ok:#1f9d55;--okbg:#dff5e8;--bad:#d1434b;--badbg:#fde6e7;
  --read:#2f6fdb;--math:#1f9d55;--vocab:#8a4fd3;--facts:#e8590c;--fun:#0c8fa3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a33;--card:#1a2748;--ink:#eef3ff;--mute:#a4b1d4;--line:#2d3d6b;
    --bus:#ffc933;--bus-ink:#1d2b53;--ok:#5fd68f;--okbg:#17402b;--bad:#ff8a90;--badbg:#4a2227;
    --read:#7aa7ff;--math:#5fd68f;--vocab:#c19bff;--facts:#ff9a5c;--fun:#4fd2e6;
  }
}
:root[data-theme="dark"]{
  --bg:#101a33;--card:#1a2748;--ink:#eef3ff;--mute:#a4b1d4;--line:#2d3d6b;
  --bus:#ffc933;--bus-ink:#1d2b53;--ok:#5fd68f;--okbg:#17402b;--bad:#ff8a90;--badbg:#4a2227;
  --read:#7aa7ff;--math:#5fd68f;--vocab:#c19bff;--facts:#ff9a5c;--fun:#4fd2e6;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:18px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{margin:0 0 8px;line-height:1.15}
h1{font-size:2.1rem;font-weight:700}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:.85rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.btn{font:inherit;font-weight:600;font-size:1.15rem;border:0;border-radius:16px;padding:14px 22px;background:var(--bus);color:var(--bus-ink);cursor:pointer;box-shadow:0 4px 0 rgba(29,43,83,.25);min-height:52px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(29,43,83,.25)}
.btn.block{display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:1rem;padding:10px 16px;min-height:44px}
.btn.sm{font-size:1rem;padding:10px 16px;min-height:44px}
.btn:focus-visible,.choice:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--read);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 16px}
.chip{font:inherit;font-weight:500;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pill{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:500;font-size:.9rem}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog>span{display:block;height:100%;background:var(--accent,var(--bus));border-radius:99px;transition:width .3s}
.accentbar{border-left:10px solid var(--accent);}
.passage{background:var(--card);border:2px solid var(--line);border-left:10px solid var(--accent);border-radius:16px;padding:16px 18px;margin-bottom:14px;font-size:1.1rem;line-height:1.55}
.passage h3{color:var(--accent)}
.qtext{font-size:1.3rem;font-weight:600;margin:6px 0 14px}
.choices{display:grid;gap:10px}
.choice{font:inherit;font-weight:500;font-size:1.15rem;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:56px}
.choice.ok{background:var(--okbg);border-color:var(--ok)}
.choice.bad{background:var(--badbg);border-color:var(--bad)}
.choice[disabled]{cursor:default}
.fact{font-size:3rem;font-weight:700;text-align:center;margin:10px 0 16px;letter-spacing:.02em}
.facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.facts-grid .choice{font-size:2rem;font-weight:700;text-align:center;padding:18px 8px;min-height:80px}
.tbar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}
.tbar>span{display:block;height:100%;width:100%;background:var(--facts);border-radius:99px}
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;font-weight:500}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb .ex{color:var(--ink);font-weight:400;margin-top:4px}
.big{font-size:4rem;line-height:1;margin-bottom:8px}
.center{text-align:center}
.stars{font-size:3rem;letter-spacing:.1em}
.score{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.score:last-child{border:0}
.score b{font-size:1.2rem}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{font:inherit;width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:120px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.row>*{flex:1 1 140px}
.cbl{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:500}
.cbl input{width:22px;height:22px;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs .chip{white-space:nowrap}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;border-bottom:2px solid var(--line);text-align:left;white-space:nowrap}
.note{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.95rem;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:12px 0}
.miss{padding:10px 0;border-bottom:2px dashed var(--line)}
.miss:last-child{border:0}
details.res{border-bottom:2px dashed var(--line);padding:10px 0}
details.res summary{cursor:pointer;line-height:1.6}
.guide h3{margin-top:18px}
.guide ol,.guide ul{margin:0 0 10px;padding-left:22px}
.guide li{margin-bottom:6px}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}.card{border:1px solid #999;break-inside:avoid}#app{max-width:none}}
@media (prefers-reduced-motion:reduce){.prog>span{transition:none}.btn:active{transform:none}}
</style>
</head>
<body>
<div id="app"></div>

  const ops=(cfg.ops&&cfg.ops.length)?cfg.ops:factOps(L);
  const f=(cfg.factors&&cfg.factors.length)?cfg.factors:FACTORS[L];
  const op=pick(g,ops);let q,ans,w;
  if(op==='+'){const a=R(g,1,9),b=R(g,1,9);q=`${a} + ${b}`;ans=a+b;w=[ans+1,ans-1,ans+2,ans-2,ans+10]}
  else if(op==='-'){const a=R(g,5,18),b=R(g,1,Math.min(9,a-1));q=`${a} − ${b}`;ans=a-b;w=[ans+1,ans-1,ans+2,ans-2,ans+10]}
  else if(op==='×'){const a=pick(g,f),b=R(g,2,L>=7?10:9);q=`${a} × ${b}`;ans=a*b;w=[ans+a,ans-a,ans+1,ans-1,ans+b]}
  else{const a=pick(g,f),b=R(g,2,9);q=`${a*b} ÷ ${a}`;ans=b;w=[b+1,b-1,b+2,b-2,a]}
  return Object.assign({type:'fact',q,exp:`${q} = ${ans}`},mc(g,ans,w));
}

/* ---------- build the day ---------- */
const SEC={
 reading:{n:'Reading',e:'📖',c:'--read',d:'Read the story. Then answer 3 questions about it.'},
 math:{n:'Math',e:'🧮',c:'--math',d:'Solve 3 math problems. Take your time and think it through.'},
 vocab:{n:'Vocabulary',e:'🔤',c:'--vocab',d:'Pick the best meaning for each word.'},
 facts:{n:'Rapid Math Facts',e:'⚡',c:'--facts',d:''},
 fun:{n:'Fun Questions',e:'🔬',c:'--fun',d:'Show what you know about science and reading!'}
};
const ORDER=['reading','math','vocab','facts','fun'];
const DEF={on:{reading:true,math:true,vocab:true,facts:true,fun:true},level:'auto',passage:'auto',mathSkill:'auto',fCount:10,timer:3,ops:[],factors:[]};
function planFor(ds){return Object.assign({},DEF,S.defaults||{},S.plans[ds]||{},{on:Object.assign({},DEF.on,(S.plans[ds]||{}).on||{})})}
function buildDay(ds){
  const plan=planFor(ds),L=plan.level==='auto'?autoLevel(ds):+plan.level,secs=[];
  ORDER.forEach(k=>{
    if(!plan.on[k])return;let items=[];
    if(k==='reading'){
      let l=L,i=dayNum(ds)%RP[L].length;
      if(plan.passage&&plan.passage!=='auto'){[l,i]=plan.passage.split('-').map(Number)}
      const p=RP[l][i],g=rngFor(ds+'r');
      items=p.q.map(x=>{const m=mc(g,x[1],[x[2],x[3],x[4]]);return{type:'mc',passage:{t:p.t,x:p.x},q:x[0],ch:m.ch,a:m.a,exp:''}});
    }else if(k==='math'){
      if(plan.mathSkill&&plan.mathSkill!=='auto'){const[l,i]=plan.mathSkill.split('-').map(Number);for(let n=0;n<3;n++)items.push(MG[l][i](rngFor(ds+'m'+n)))}
      else{
        const g=rngFor(ds+'mp'),order=shuffle(g,MG[L].map((_,i)=>i));
        items.push(MG[L][order[0]](rngFor(ds+'m0')),MG[L][order[1]](rngFor(ds+'m1')));
        if(L>0){const l2=R(g,0,L-1),i2=R(g,0,MG[l2].length-1);items.push(MG[l2][i2](rngFor(ds+'m2')))}
        else items.push(MG[L][order[2]](rngFor(ds+'m2')));
      }
    }else if(k==='vocab'){
      const g=rngFor(ds+'v'),pool=VB.flat();
      items=shuffle(g,VB[L]).slice(0,3).map(w=>{
        const wr=shuffle(g,pool.filter(p=>p[0]!==w[0]&&p[1]!==w[1])).slice(0,3).map(p=>p[1]);
        const m=mc(g,w[1],wr);return{type:'mc',q:`What does the word “${w[0]}” mean?`,ch:m.ch,a:m.a,exp:`“${w[0]}” means ${w[1]}.`}});
    }else if(k==='facts'){
      for(let i=0;i<(+plan.fCount||10);i++)items.push(factItem(Math.random,L,plan));
    }else if(k==='fun'){
      const g=rngFor(ds+'f');
      items=shuffle(g,FBM[L]).slice(0,3).map(x=>{const m=mc(g,x[1],[x[2],x[3],x[4]]);return{type:'mc',q:x[0],ch:m.ch,a:m.a,exp:`The answer is ${x[1]}.`}});
    }
    secs.push({key:k,items});
  });
  return{L,plan,secs};
}

function startRun(name,ds,record){
  const day=buildDay(ds);

}

function qH(){
  const s=sec(),it=s.items[ST.ii],m=SEC[s.key];ST.cur=it;ST.locked=false;
  const head=`<div style="--accent:var(${m.c})"><div class="top"><span class="pill">${m.e} ${m.n}</span><span class="pill">${ST.ii+1} of ${s.items.length}</span></div><div class="prog"><span style="width:${ST.done/ST.total*100}%"></span></div>`;
  if(it.type==='fact'){
    return head+`<div class="card"><div class="tbar"><span id="tb"></span></div><div class="fact">${it.q} = ?</div><div class="facts-grid">${it.ch.map((c,i)=>`<button class="choice" data-i="${i}" onclick="choose(${i})">${esc(c)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
  }
  return head+(it.passage?`<div class="passage"><h3>${esc(it.passage.t)}</h3>${esc(it.passage.x)}</div>`:'')+
   `<div class="card"><div class="qtext">${esc(it.q)}</div><div class="choices">${it.ch.map((c,i)=>`<button class="choice" data-i="${i}" onclick="choose(${i})">${esc(c)}</button>`).join('')}</div><div id="fb"></div></div></div>`;
}
function startFactTimer(){
  const secs=+ST.day.plan.timer||3,tb=$('#tb');
  if(tb){tb.style.transition=`width ${secs}s linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.width='0%'}))}
  ST.tmo=setTimeout(()=>choose(-1),secs*1000);
}
const PRAISE=['Great job!','Nice work!','You got it!','Awesome!','Super smart!'];
function choose(i){
  if(ST.locked)return;ST.locked=true;
  if(ST.tmo){clearTimeout(ST.tmo);ST.tmo=null}
  const it=ST.cur,s=sec(),ok=i===it.a,btns=document.querySelectorAll('.choice');
  btns.forEach(b=>b.disabled=true);
  if(ok)ST.ok=true;
  btns[it.a].classList.add('ok');
  if(i>=0&&!ok)btns[i].classList.add('bad');
  if(ok)ST.score[s.key][0]++;
  else ST.missed.push({k:s.key,q:it.type==='fact'?it.q+' = ?':it.q,t:it.passage?it.passage.t:'',y:i>=0?it.ch[i]:'(time ran out)',c:it.ch[it.a]});
  const tb=$('#tb');if(tb){tb.style.transition='none'}
  ST.done++;
  const fb=$('#fb');
  if(it.type==='fact'){
    fb.innerHTML=ok?'':`<div class="fb bad">${i===-1?'⏰ Time’s up! ':''}${esc(it.exp)}</div>`;
    setTimeout(advance,ok?450:1300);
  }else{
    const ans=it.ch[it.a];
    fb.innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✅ '+PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Not quite. The answer is: '+esc(ans)}${it.exp?`<div class="ex">${esc(it.exp)}</div>`:''}</div><div style="height:12px"></div><button class="btn block" onclick="advance()">Next</button>`;
    fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
function advance(){
  const s=sec();ST.ii++;
  if(ST.ii>=s.items.length){
    ST.si++;ST.ii=0;
    if(ST.si>=ST.day.secs.length){finish();return}
    V='intro';
  }else V='q';
  draw();
}
function finish(){
  if(ST.record){S.results.push({name:ST.name,date:ST.ds,level:ST.day.L,s:ST.score,m:ST.missed.slice(0,40),ts:Date.now()});if(S.results.length>1500)S.results=S.results.slice(-1500);save()}
  V='done';draw();
}
function missedH(list){
  if(!list||!list.length)return '<p class="mute">No missed questions. Great work!</p>';
  return list.map(x=>`<div class="miss"><div class="small mute">${SEC[x.k]?SEC[x.k].n:''}${x.t?' · '+esc(x.t):''}</div><div><b>${esc(x.q)}</b></div><div class="small">Your answer: <span style="color:var(--bad)">${esc(x.y)}</span> · Correct answer: <span style="color:var(--ok)">${esc(x.c)}</span></div></div>`).join('');

  return `<div class="card center" style="padding:28px 18px"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><h1>${esc(ST.name)}, you finished!</h1><p>${msg}</p><p class="mute">${c} of ${t} correct${ST.record?'':' (preview, not saved)'}</p></div>
  <div class="card">${ST.day.secs.map(s=>`<div class="score"><span>${SEC[s.key].e} ${SEC[s.key].n}</span><b style="color:var(${SEC[s.key].c})">${ST.score[s.key][0]} / ${ST.score[s.key][1]}</b></div>`).join('')}</div>

}

/* ---------- QR join ---------- */
function qrSvg(text,ec){
  const q=qrcode(0,ec||'M');q.addData(text);q.make();
  const n=q.getModuleCount(),m=4,sz=n+m*2;let p='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m},${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="QR code for students to join" style="width:100%;height:auto;display:block"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`;
}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function baseURL(){if(S.hostURL)return S.hostURL.split('#')[0];if(location.protocol==='file:')return'';return location.href.split('#')[0]}
function joinPayload(level){
  const o={v:1,c:S.className||''};
  if(level<2)o.r=S.roster;
  if(level<1){const t=todayStr(),p={};Object.keys(S.plans).filter(k=>k>=t).sort().slice(0,30).forEach(k=>p[k]=S.plans[k]);if(Object.keys(p).length)o.p=p}
  return b64e(JSON.stringify(o));
}
function joinLink(){
  const b=baseURL();if(!b)return null;
  let level=0,u=b+'#join='+joinPayload(0);
  while(u.length>1000&&level<2){level++;u=b+'#join='+joinPayload(level)}
  return{url:u,level,base:b};
}
function cleanPlan(p){
  if(!p||typeof p!=='object')return null;const o={};
  if(p.on&&typeof p.on==='object'){o.on={};ORDER.forEach(k=>{if(typeof p.on[k]==='boolean')o.on[k]=p.on[k]})}
  if(p.level==='auto'||/^[0-8]$/.test(String(p.level)))o.level=String(p.level);
  const ref=(v,A)=>{if(v==='auto')return'auto';const m=/^(\d)-(\d{1,2})$/.exec(String(v));return m&&A[+m[1]]&&A[+m[1]][+m[2]]?v:null};
  const pa=ref(p.passage,RP),ma=ref(p.mathSkill,MG);if(pa)o.passage=pa;if(ma)o.mathSkill=ma;
  if(Number.isFinite(+p.fCount))o.fCount=Math.max(3,Math.min(30,Math.round(+p.fCount)));
  if(Number.isFinite(+p.timer))o.timer=Math.max(2,Math.min(15,Math.round(+p.timer)));
  if(Array.isArray(p.ops))o.ops=['+','-','×','÷'].filter(x=>p.ops.includes(x));
  if(Array.isArray(p.factors))o.factors=[2,3,4,5,6,7,8,9,10].filter(x=>p.factors.includes(x));
  return o;
}
function tryJoin(){
  const m=/[#&]join=([A-Za-z0-9_-]+)/.exec(location.hash||'');if(!m)return'';
  try{
    const o=JSON.parse(b64d(m[1]));if(!o||o.v!==1)return'';
    if(typeof o.c==='string')S.className=o.c.slice(0,60);
    if(Array.isArray(o.r))S.roster=o.r.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,40)).filter(Boolean).slice(0,60);
    if(o.p&&typeof o.p==='object')Object.keys(o.p).slice(0,40).forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)){const c=cleanPlan(o.p[k]);if(c)S.plans[k]=c}});
    save();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    return S.className||'your class';
  }catch(e){return''}
}

  const note=jl&&jl.level===1?'The daily plans were too long to fit in the QR, so it carries the class name and class list only.':jl&&jl.level===2?'The class list was too long to fit in the QR, so students will tap Let’s go and type their own names.':'';

   <label class="f">Rapid math facts</label>
   <div class="row"><div><span class="small mute">Questions</span><input type="number" id="fc" min="3" max="30" value="${+p.fCount||10}"></div><div><span class="small mute">Seconds each</span><input type="number" id="ft" min="2" max="15" value="${+p.timer||3}"></div></div>
   <div style="margin-top:8px"><span class="small mute">Operations (none checked = automatic)</span>
   <div class="row" style="gap:0 12px">${[['+','Add'],['-','Subtract'],['×','Multiply'],['÷','Divide']].map(o=>cb('op_'+o[0],o[1],(p.ops||[]).includes(o[0]))).join('')}</div></div>
   <div style="margin-top:8px"><span class="small mute">Times tables (none checked = automatic)</span>
   <div class="row" style="gap:0 12px">${[2,3,4,5,6,7,8,9,10].map(n=>cb('fa_'+n,n,(p.factors||[]).includes(n))).join('')}</div></div>
   <div style="height:16px"></div>
   <button class="btn block" onclick="savePlan(0)">Save for this day</button><div style="height:10px"></div>
   <div class="row"><button class="btn ghost" onclick="savePlan(1)">Save for Mon–Fri of this week</button><button class="btn ghost" onclick="clearPlan()">Reset to automatic</button><button class="btn ghost" onclick="previewDay()">Preview</button></div>
  </div>`;
}
function readPlan(){
  const on={};ORDER.forEach(k=>on[k]=document.getElementById('on_'+k).checked);
  return{on,level:$('#pl').value,passage:$('#pp').value,mathSkill:$('#pm').value,fCount:Math.max(3,Math.min(30,+$('#fc').value||10)),timer:Math.max(2,Math.min(15,+$('#ft').value||3)),
    ops:['+','-','×','÷'].filter(o=>document.getElementById('op_'+o).checked),factors:[2,3,4,5,6,7,8,9,10].filter(n=>document.getElementById('fa_'+n).checked)};
}
function savePlan(week){
  const p=readPlan();
  if(week){const d=new Date(TP.date+'T12:00:00'),dow=(d.getDay()+6)%7,mon=addDays(TP.date,-dow);for(let i=0;i<5;i++)S.plans[addDays(mon,i)]=JSON.parse(JSON.stringify(p))}
  else S.plans[TP.date]=p;
  save();alert(week?'Saved for Monday to Friday of this week.':'Saved for '+TP.date+'.');draw();
}
function clearPlan(){delete S.plans[TP.date];save();draw()}
function previewDay(){const p=readPlan(),old=S.plans[TP.date];S.plans[TP.date]=p;startRun('Preview',TP.date,false);if(old)S.plans[TP.date]=old;else delete S.plans[TP.date]}
function rosterH(){
  return `<div class="card"><h3>Student names</h3><p class="small mute">One name per line. Students pick their name on the home screen.</p><textarea id="ro">${esc(S.roster.join('\n'))}</textarea><div style="height:12px"></div><button class="btn block" onclick="saveRoster()">Save students</button></div>`;
}
function saveRoster(){S.roster=$('#ro').value.split('\n').map(x=>x.trim()).filter(Boolean);save();alert('Saved '+S.roster.length+' students.');draw()}
let RF='all';
function resultsH(){
  const dates=[...new Set(S.results.map(r=>r.date))].sort().reverse();
  const rs=S.results.filter(r=>RF==='all'||r.date===RF).slice().reverse().slice(0,150);
  const f=r=>k=>r.s&&r.s[k]?`${r.s[k][0]}/${r.s[k][1]}`:'–';
  const csv='Date,Student,Reading,Math,Vocab,Facts,Fun\n'+S.results.map(r=>{const g=f(r);return [r.date,'"'+String(r.name).replace(/"/g,'""')+'"',...ORDER.map(k=>'"'+g(k)+'"')].join(',')}).join('\n');
  return `${storageOK?'':'<div class="note" style="border-color:var(--bad);margin-bottom:14px">Saving is blocked in this browser (private window or a restricted device), so scores are not being kept. Use the raise-your-hand routine in the Guide tab.</div>'}
  <div class="card"><h3>Results on this device</h3>
  <select onchange="RF=this.value;draw()" aria-label="Filter by date"><option value="all">All dates</option>${dates.map(d=>`<option value="${d}" ${RF===d?'selected':''}>${d}</option>`).join('')}</select>
  <p class="small mute" style="margin-top:8px">Tap a student to see the questions they missed.</p>
  ${rs.length?rs.map(r=>{const g=f(r);return `<details class="res"><summary><b>${esc(r.name)}</b> · ${r.date}<br>${ORDER.map(k=>SEC[k].e+' '+g(k)).join('&nbsp;&nbsp; ')}</summary><div style="padding-top:8px">${missedH(r.m||[])}</div></details>`}).join(''):'<p class="mute">No results on this device yet. They appear here after students finish.</p>'}</div>
  ${S.results.length?`<div class="card"><h3>Copy all results (CSV)</h3><textarea readonly onclick="this.select()">${esc(csv)}</textarea></div>`:''}`;
}
function guideH(){
  return `<div class="card guide"><button class="btn sm noprint" onclick="window.print()">Print this guide</button>
  <h2 style="margin-top:14px">Morning Work Teacher Guide</h2><p class="mute">Grade 3 · ${EDITION.name}</p>
  <h3>Set up (5 minutes, once)</h3>
  <ol><li>Open the file in Chrome, Edge, or Safari on the device students will use. Bookmark it.</li>
  <li>Tap <b>Teacher area</b> and enter the PIN (starts as 1234). Change it in <b>Settings</b>.</li>
  <li>In <b>Students</b>, type your class list, one name per line, then save.</li>
  <li>In <b>Settings</b>, add your class name.</li>
  <li>Optional: use <b>Daily plan</b> to choose the day’s passage, math focus, or rapid-fact settings. Leave anything on Automatic and it follows the school year from easier in September to harder in May.</li></ol>
  <h3>Get students on their Chromebooks</h3>
  <ol><li>Chromebooks reach the page through a web address, so put this file on a free web host (for example GitHub Pages) and open the hosted link.</li>
  <li>Open <b>Teacher area</b>, then <b>Student QR</b>. Print the poster or put it on your screen.</li>
  <li>Students scan the QR with the Chromebook or tablet camera. It opens the page with your class name, class list, and daily plan already loaded.</li>
  <li>If a device cannot scan, students type the short link shown under the QR. They can still type their own name, and Automatic content is the same on every device.</li>
  <li>Make a new QR whenever you change the class list or a daily plan.</li></ol>
  <h3>Daily routine (10–15 minutes)</h3>
  <ol><li>Student taps their name, then <b>Let’s go!</b></li>
  <li>They finish five parts in order: Reading, Math, Vocabulary, Rapid Math Facts, Fun Questions.</li>
  <li>Rapid facts give about 3 seconds per question. They should answer in their head.</li></ol>
  <h3>How you see scores and mistakes</h3>
  <ul><li><b>On the student’s screen:</b> when a student finishes, the last screen shows their score for each part and a list of every question they missed with the correct answer. <b>Students raise their hand and show you this screen before tapping Done.</b> Do this whenever scores must be seen right away.</li>
  <li><b>In the Results tab:</b> every finished session is saved on that device. Open Teacher area, then Results. Tap a student to see what they missed. You can filter by date and copy all results as a spreadsheet (CSV).</li>
  <li><b>Different devices keep their own results.</b> If students use more than one device, open Settings on each device, copy the backup code, and on your main device paste it under <b>Add results from this code</b>.</li></ul>
  <h3>When scores will not save</h3>
  <p>Scores are saved in the browser on each device. They will not be saved in a private or guest window, or on devices that erase data when students sign out. They will also be gone if browsing data is cleared. In those cases the raise-your-hand routine still works, because the finish screen always shows the score and missed questions. Use <b>Settings, Back up</b> every so often.</p>
  <h3>Student routine (read aloud on day one)</h3>
  <ol><li>Tap your name.</li><li>Do your best work. Think before you tap.</li><li>When you finish, raise your hand.</li><li>Show your teacher your screen. Look at the questions you missed.</li><li>Tap Done.</li></ol>
  <h3>Your license</h3>
  <p>${EDITION.name}${EDITION.expires?' · valid through '+EDITION.expires:''}. One license per teacher. Please do not share or resell this file.</p>
  <p class="small mute">Standards referenced: Common Core State Standards for Mathematics and English Language Arts, © 2010 National Governors Association Center for Best Practices and Council of Chief State School Officers. All rights reserved.</p></div>`;
}
function backupStr(){return JSON.stringify({v:1,className:S.className,hostURL:S.hostURL||'',roster:S.roster,plans:S.plans,defaults:S.defaults,results:S.results})}
function settingsH(){
  return `<div class="card"><h3>Class name</h3><input id="cn" type="text" value="${esc(S.className||'')}" placeholder="e.g., Ms. Rivera’s Class"><div style="height:10px"></div><button class="btn sm" onclick="S.className=$('#cn').value.trim();save();alert('Saved.');draw()">Save class name</button></div>
  <div class="card"><h3>Change teacher PIN</h3><label class="f" for="np" style="margin-top:0">New PIN</label><input id="np" type="text" inputmode="numeric" maxlength="8"><div style="height:12px"></div><button class="btn sm" onclick="const v=$('#np').value.trim();if(v.length<3){alert('Use at least 3 characters.');return}S.pin=v;save();alert('PIN changed.');draw()">Save PIN</button></div>
  <div class="card"><h3>Back up or move your data</h3><p class="small mute">Copy this code and keep it somewhere safe.</p><textarea readonly onclick="this.select()">${esc(backupStr())}</textarea>
  <label class="f" for="imp">Paste a backup code from this or another device</label><textarea id="imp"></textarea><div style="height:10px"></div>
  <div class="row"><button class="btn sm" onclick="importData('merge')">Add results from this code</button><button class="btn ghost" onclick="importData('restore')">Restore everything</button></div></div>
  <div class="card"><h3>Start fresh</h3><p class="small mute">Use this at the start of a new year or class.</p><button class="btn ghost" onclick="resetAll()">Erase students, plans, and results</button></div>
  <div class="note">${storageOK?'Saving is working on this device.':'Saving is blocked in this browser, so nothing will be kept.'} Plans, students, and results live in this browser on this device only.</div>`;
}
function importData(mode){
  let o;try{o=JSON.parse($('#imp').value)}catch(e){alert('That code could not be read. Copy the whole backup code and try again.');return}
  if(!o||!Array.isArray(o.results)){alert('That does not look like a backup code.');return}
  const good=o.results.filter(r=>r&&typeof r.name==='string'&&r.s&&typeof r.ts==='number');
  if(mode==='restore'){S.className=String(o.className||'');S.hostURL=String(o.hostURL||'');S.roster=Array.isArray(o.roster)?o.roster.map(String):[];S.plans=(o.plans&&typeof o.plans==='object')?o.plans:{};S.defaults=(o.defaults&&typeof o.defaults==='object')?o.defaults:{};S.results=good;save();alert('Restored.')}
  else{const seen=new Set(S.results.map(r=>r.name+'|'+r.ts));let n=0;good.forEach(r=>{const k=r.name+'|'+r.ts;if(!seen.has(k)){seen.add(k);S.results.push(r);n++}});S.results.sort((a,b)=>a.ts-b.ts);save();alert('Added '+n+' results.')}
  draw();
}
function resetAll(){if(confirm('Erase all students, plans, and results on this device?')){S.roster=[];S.plans={};S.defaults={};S.results=[];S.className='';S.hostURL='';save();draw()}}
joinMsg=tryJoin();
draw();
</script>
</body>
</html>
